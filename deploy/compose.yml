# Nextcloud with Deliver: a starting point, not a hardened setup.
# Copy .env.example to .env, fill it in, then `docker compose up -d`.
# Put a reverse proxy with TLS in front; the port is bound to localhost only.

x-nextcloud: &nextcloud
  build:
    context: .
    args:
      RENDER_GID: ${RENDER_GID:-992}
  image: nextcloud-deliver:local
  restart: unless-stopped
  volumes:
    - nextcloud:/var/www/html
    - ${DATA_DIR:-./data}:/var/www/html/data
  # The GPU for hardware-encoded Proxies. Remove on hosts without one;
  # ffmpeg then encodes in software.
  devices:
    - /dev/dri:/dev/dri
  depends_on:
    - db
    - redis

services:
  app:
    <<: *nextcloud
    ports:
      - 127.0.0.1:${HTTP_PORT:-8080}:80
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?set NEXTCLOUD_ADMIN_PASSWORD in .env}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_DOMAIN:?set NEXTCLOUD_DOMAIN in .env}
      OVERWRITEPROTOCOL: https
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      PHP_UPLOAD_LIMIT: 20G

  # Nextcloud's background jobs, Deliver's derived media among them. ffmpeg
  # runs here, so this container needs the GPU as much as the web server.
  cron:
    <<: *nextcloud
    entrypoint: /cron.sh

  # Optional: works through the derived-media queue as jobs arrive instead of
  # every five minutes. Start with `docker compose --profile worker up -d`.
  worker:
    <<: *nextcloud
    profiles: [worker]
    user: www-data
    entrypoint: [php, /var/www/html/occ, deliver:worker]

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  nextcloud:
  db:
