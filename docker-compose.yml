name: nextcloud-deliver

services:
  nextcloud:
    build:
      context: ./deploy
      args:
        NEXTCLOUD_VERSION: "34"
    image: deliver-nextcloud:34-ffmpeg
    # Bound, not published to the world: the dev instance carries a known admin
    # password, and the trusted-domain check falls to a forged Host header.
    # localhost for the tests on this machine, the tailnet address for the
    # browser in its own container and for other machines in the tailnet.
    ports:
      - 127.0.0.1:8080:80
      - 100.84.4.11:8080:80
    environment:
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=adminadmin123
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost 127.0.0.1 ${DELIVER_EXTRA_TRUSTED_DOMAINS:-}
      # The address links in mails and background jobs point to (overwrite.cli.url)
      - OVERWRITECLIURL=${DELIVER_URL:-http://localhost:8080}
      - POSTGRES_HOST=db
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=nextcloud
    # The host's iGPU, for the hardware encoder Deliver probes (ADR 0003)
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./docker/nextcloud:/var/www/html
      - .:/var/www/html/custom_apps/deliver
      - ./dev/opcache.ini:/usr/local/etc/php/conf.d/zz-dev-opcache.ini:ro
    restart: unless-stopped
    depends_on:
      - db
      - mail

  # Catches every mail the instance sends, e.g. to Reviewers about Replies.
  # Its inbox is bound like Nextcloud: this machine and the tailnet, not the LAN.
  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - 127.0.0.1:8025:8025
      - 100.84.4.11:8025:8025

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=nextcloud
    volumes:
      - ./docker/db:/var/lib/postgresql/data
