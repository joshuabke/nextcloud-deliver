# The changelog section of a release, from the squashed PR titles since the
# last tag: feat and fix titles become its lines, every other type stays out.
# `make release` writes it; see docs/development.md.

[changelog]
header = ""
body = """
## {{ version | trim_start_matches(pat="v") }} – {{ timestamp | date(format="%Y-%m-%d") }}
{% set groups = commits | group_by(attribute="group") %}
{% for group, commits in groups %}{% if groups | length > 1 %}
### {{ group | striptags }}
{% endif %}
{% for commit in commits %}- {{ commit.message | split(pat="\n") | first | trim | upper_first | trim_end_matches(pat=".") }}.
{% endfor %}{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
tag_pattern = "v[0-9]*"
# GitHub appends the PR number to a squashed title
commit_preprocessors = [
  { pattern = '(?m) *\(#\d+\)$', replace = "" },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = ".*", skip = true },
]
filter_commits = true
sort_commits = "oldest"

[bump]
# 0.x: a feature bumps the minor version, a breaking change too, never the major
features_always_bump_minor = true
breaking_always_bump_major = false
