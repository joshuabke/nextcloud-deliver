# The changelog section of a release, from the squashed PR titles since the
# last tag: feat and fix become lines in the style of pulsejet/memories, every
# other type stays out. `make release` writes it; see docs/development.md.

[changelog]
header = ""
body = """
## {{ version | trim_start_matches(pat="v") }} – {{ timestamp | date(format="%Y-%m-%d") }}

{% for group, commits in commits | group_by(attribute="group") %}{% for commit in commits %}- **{{ group | striptags }}**: {{ commit.message | split(pat="\n") | first | trim | upper_first }}
{% endfor %}{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
tag_pattern = "v[0-9]*"
# GitHub appends the PR number to a squashed title
commit_preprocessors = [
  { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/joshuabke/nextcloud-deliver/pull/${1}))" },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Feature" },
  { message = "^fix", group = "<!-- 1 -->Fix" },
  { message = ".*", skip = true },
]
filter_commits = true
sort_commits = "oldest"

[bump]
# 0.x: a feature bumps the minor version, a breaking change too, never the major
features_always_bump_minor = true
breaking_always_bump_major = false
